name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-pr-title:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
      - uses: astral-sh/setup-uv@v7
      - name: pre-commit
        run: uv run --locked --all-extras prek run --all-files

  test:
    needs:
      - validate-pr-title
      - pre-commit
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          # - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
      - uses: astral-sh/setup-uv@v7
      - name: Setup llama.cpp to PATH
        uses: pbrisbin/setup-tool-action@v2
        with:
          name: llama
          url: "https://github.com/ggml-org/llama.cpp/releases/download/{version}/{name}-{version}-bin-{os}-{arch}.{ext}"
          os-win32: win-cpu
          os-linux: ubuntu
          os-darwin: macos
          subdir-linux: "{name}-{version}"
          subdir-darwin: "{name}-{version}"
      - name: pytest
        run: uv run --frozen --all-extras pytest --verbose
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  report:
    if: always()
    needs:
      - validate-pr-title
      - pre-commit
      - test
    runs-on: ubuntu-slim
    steps:
    - uses: re-actors/alls-green@release/v1
      with:
        jobs: ${{ toJSON(needs) }}
