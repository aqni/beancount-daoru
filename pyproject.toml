[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[project]
dynamic = ["version"]
name = "beancount-daoru"
dependencies = [
    "beangulp>=0.2,<0.3",
    "pydantic>=2.12",
    "pyexcel>=0.7",
    "pyexcel-xlsxr>=0.6.2",
    "pdfplumber>=0.11.8",
    "typing-extensions>=4.15.0",
]
requires-python = ">=3.10"
authors = [{ name = "AN Qi", email = "aqnin@outlook.com" }]
description = "beancount importers for Chinese"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]

[project.urls]
repository = "https://github.com/aqni/beancount-daoru"

[project.optional-dependencies]
llm = ["diskcache>=5.6.3", "openai>=2.11.0", "usearch>=2.21.0"]

[dependency-groups]
test = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-xprocess>=1.0.2",
    "gitpython>=3.1",
    "llama-cpp-python>=0.3.34",
]

lint = [
    "ruff>=0.14.7",
    "basedpyright>=1.36.1",
    "pymarkdownlnt>=0.9.39",
]

dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "debugpy>=1.8.18",
]

[tool.uv.sources]
llama-cpp-python = [
    { index = "llama-cpp-python-metal", marker = "sys_platform == 'darwin'" },
    { index = "llama-cpp-python-vulkan", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "llama-cpp-python-vulkan"
url = "https://abetlen.github.io/llama-cpp-python/whl/vulkan"
explicit = true

[[tool.uv.index]]
name = "llama-cpp-python-metal"
url = "https://abetlen.github.io/llama-cpp-python/whl/metal"
explicit = true

[tool.pytest.ini_options]
addopts = "--cov=src/ --cov-branch"
testpaths = ["tests"]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

[tool.ruff]
lint.extend-select = ["ALL"]
lint.extend-ignore = ["COM812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "S603", "RUF001"]
"examples/*" = ["D", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
include = ["src"]
allowedUntypedLibraries = [
    "beangulp",
    "diskcache",
    "xprocess",
    "pyexcel",
    "usearch",
]


# See https://packaging.python.org for more information on Python project metadata
